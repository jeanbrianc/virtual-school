AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Izzy's Virtual Classroom on your own AWS account: a private S3 bucket behind
  CloudFront with an HTTPS certificate and a Route 53 name, a site password
  (CloudFront Function), and the optional AI teachers helper (Lambda) at /api.
  Deploy with scripts/deploy/aws-deploy.sh (region us-east-1).

Parameters:
  DomainName:
    Type: String
    Default: lms.brianjeanbuilds.com
    Description: Site address (a name inside the Route 53 hosted zone below).
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Route 53 public hosted zone that contains DomainName.
  BasicAuthHash:
    Type: String
    NoEcho: true
    AllowedPattern: '^[a-f0-9]{64}$'
    Description: SHA-256 (hex) of the full Authorization header value "Basic base64(user:password)". The deploy script computes it; the password itself is never stored.
  AnthropicApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: Anthropic API key for the AI teachers. Leave empty to keep them off (the site then uses its built-in teachers).
  OriginSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Random value CloudFront adds to /api requests so the Lambda only answers traffic that passed the site password.
  AiModel:
    Type: String
    Default: claude-haiku-4-5-20251001
  AiDailyLimit:
    Type: Number
    Default: 300
    MinValue: 1
    Description: Most AI replies per day (per running Lambda instance).
  GitHubRepo:
    Type: String
    Default: jeanbrianc/virtual-school
    Description: owner/name of the repository whose main branch may deploy.
  GitHubBranch:
    Type: String
    Default: main
  CreateGitHubOidcProvider:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: 'false if this AWS account already has the token.actions.githubusercontent.com identity provider.'

Rules:
  CloudFrontCertificatesLiveInUsEast1:
    Assertions:
      - Assert: !Equals [!Ref 'AWS::Region', us-east-1]
        AssertDescription: Deploy this stack in us-east-1 (CloudFront only uses certificates from that region).

Conditions:
  CreateOidc: !Equals [!Ref CreateGitHubOidcProvider, 'true']

Resources:
  # ── Website files ─────────────────────────────────────────────────────────
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: forget-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-site'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFrontReadsSite
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  # ── HTTPS certificate (validated automatically through Route 53) ─────────
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  # ── Site password: HTTP Basic auth at the edge ───────────────────────────
  # Compares a SHA-256 of the browser's Authorization header with the stored
  # hash, so the password itself is never in AWS. Covers the whole site,
  # including /api, so the AI helper can't be used without the password.
  PasswordFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-password'
      AutoPublish: true
      FunctionConfig:
        Comment: Family password for the virtual school
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        var crypto = require('crypto');
        var EXPECTED = '${BasicAuthHash}';
        function handler(event) {
          var request = event.request;
          var auth = request.headers.authorization;
          if (auth && crypto.createHash('sha256').update(auth.value).digest('hex') === EXPECTED) {
            delete request.headers.authorization;
            return request;
          }
          return {
            statusCode: 401,
            statusDescription: 'Unauthorized',
            headers: {
              'www-authenticate': { value: 'Basic realm="Family School", charset="UTF-8"' },
              'cache-control': { value: 'no-store' }
            }
          };
        }

  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-security-headers'
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            # Same rules as `npm run preview`: nothing third-party; connections only
            # to this site, a local helper, or a parent-configured https endpoint.
            ContentSecurityPolicy: "default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https: http://127.0.0.1:* http://localhost:*; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: no-referrer
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: false
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: 'microphone=(self), camera=(), geolocation=(), payment=(), usb=()'
              Override: true
            - Header: X-Robots-Tag
              Value: 'noindex, nofollow'
              Override: true

  # ── AI teachers helper (Lambda, reached only through CloudFront /api/*) ──
  AiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-ai-helper'
      RetentionInDays: 14

  AiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub '${AiLogGroup.Arn}:*'

  AiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-ai-helper'
      Description: AI teachers helper for the virtual school (scripts/ai-helper/lambda.ts)
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: index.handler
      MemorySize: 256
      Timeout: 25
      Role: !GetAtt AiRole.Arn
      LoggingConfig:
        LogGroup: !Ref AiLogGroup
      Environment:
        Variables:
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          ORIGIN_SECRET: !Ref OriginSecret
          SITE_ORIGIN: !Sub 'https://${DomainName}'
          AI_MODEL: !Ref AiModel
          AI_DAILY_LIMIT: !Ref AiDailyLimit
      # Placeholder until the deploy uploads the real bundle (dist-lambda/ai-helper.zip).
      Code:
        ZipFile: |
          exports.handler = async () => ({
            statusCode: 503,
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ error: 'The AI helper code has not been uploaded yet.' })
          });

  AiFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt AiFunction.Arn
      AuthType: NONE

  # Function URLs with AuthType NONE need both statements (AWS requirement since Oct 2025).
  # The function itself refuses anything without CloudFront's X-Origin-Verify secret.
  AiUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AiFunction
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

  AiUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AiFunction
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true

  # ── CloudFront ───────────────────────────────────────────────────────────
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'Virtual school (${DomainName})'
        Aliases: [!Ref DomainName]
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: ai-helper
            DomainName: !Select [2, !Split ['/', !GetAtt AiFunctionUrl.FunctionUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: !Ref OriginSecret
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeaders
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt PasswordFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: ai-helper
            ViewerProtocolPolicy: https-only
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
            ResponseHeadersPolicyId: !Ref SecurityHeaders
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt PasswordFunction.FunctionMetadata.FunctionARN

  # ── lms.brianjeanbuilds.com → CloudFront ─────────────────────────────────
  DnsIPv4:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2 # CloudFront's fixed alias zone
        EvaluateTargetHealth: false

  DnsIPv6:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  # ── GitHub Actions deploys (no stored AWS keys: OpenID Connect) ──────────
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub 'Lets ${GitHubRepo}@${GitHubBranch} publish the site and AI helper'
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidc
                - !Ref GitHubOidcProvider
                - !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubRepo}:ref:refs/heads/${GitHubBranch}'
      Policies:
        - PolicyName: publish-site
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SiteBucket.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub '${SiteBucket.Arn}/*'
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
              - Effect: Allow
                Action: [lambda:UpdateFunctionCode, lambda:GetFunction, lambda:GetFunctionConfiguration]
                Resource: !GetAtt AiFunction.Arn
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Ref AWS::StackId

Outputs:
  SiteUrl:
    Value: !Sub 'https://${DomainName}'
  BucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  AiFunctionName:
    Value: !Ref AiFunction
  DeployRoleArn:
    Description: Put this in the GitHub repository secret AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt GitHubDeployRole.Arn
