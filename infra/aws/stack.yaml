AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Izzy's Virtual Classroom on your own AWS account: a private S3 bucket behind
  CloudFront with an HTTPS certificate and a Route 53 name, a site password
  (CloudFront Function), and the optional AI teachers helper (Lambda) at /api —
  OpenAI (key read from Secrets Manager) or Anthropic — plus family sync
  (DynamoDB + S3) so every signed-in device shares the same school.
  Deploy with scripts/deploy/aws-deploy.sh (region us-east-1). Visitors land on
  a branded sign-in page; the school and its AI helper need the family password.

Parameters:
  DomainName:
    Type: String
    Default: lms.brianjeanbuilds.com
    Description: Site address (a name inside the Route 53 hosted zone below).
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Route 53 public hosted zone that contains DomainName.
  BasicAuthHash:
    Type: String
    NoEcho: true
    AllowedPattern: '^[a-f0-9]{64}$'
    Description: SHA-256 (hex) of "Basic base64(user:password)" — what the sign-in page sends. The deploy script computes it; the password itself is never stored.
  AnthropicApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: Anthropic API key for the AI teachers. Leave empty to keep them off (the site then uses its built-in teachers).
  SessionSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Random key that signs family sign-in cookies. Changing it signs everyone out (the deploy script rotates it with --password).
  OriginSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Random value CloudFront adds to /api requests so the Lambda only answers traffic that passed the site password.
  OpenAiSecretArn:
    Type: String
    NoEcho: true
    Default: ''
    AllowedPattern: '^$|^arn:aws[a-z-]*:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$'
    Description: >-
      ARN of a Secrets Manager secret (this account, any region) holding an OpenAI API key.
      Turns on OpenAI teacher replies, natural teacher voices and listening. The Lambda reads
      the secret when it needs it; the key is never copied into this stack. Empty = no OpenAI.
  OpenAiSecretKmsKeyArn:
    Type: String
    NoEcho: true
    Default: ''
    Description: Only if that secret is encrypted with a customer-managed KMS key (the deploy script fills this in).
  OpenAiModel:
    Type: String
    Default: gpt-6-luna
    Description: OpenAI model for teacher replies.
  AiModel:
    Type: String
    Default: claude-haiku-4-5-20251001
    Description: Anthropic model for teacher replies (used only without an OpenAI key).
  AiDailyLimit:
    Type: Number
    Default: 300
    MinValue: 1
    Description: Most AI replies per day (per running Lambda instance). Voices and listening have their own limits (1500 and 500).
  GitHubRepo:
    Type: String
    Default: jeanbrianc/virtual-school
    Description: owner/name of the repository whose main branch may deploy.
  GitHubBranch:
    Type: String
    Default: main
  CreateGitHubOidcProvider:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: 'false if this AWS account already has the token.actions.githubusercontent.com identity provider.'

Rules:
  CloudFrontCertificatesLiveInUsEast1:
    Assertions:
      - Assert: !Equals [!Ref 'AWS::Region', us-east-1]
        AssertDescription: Deploy this stack in us-east-1 (CloudFront only uses certificates from that region).

Conditions:
  CreateOidc: !Equals [!Ref CreateGitHubOidcProvider, 'true']
  HasOpenAiSecret: !Not [!Equals [!Ref OpenAiSecretArn, '']]
  HasOpenAiKmsKey: !And
    - !Condition HasOpenAiSecret
    - !Not [!Equals [!Ref OpenAiSecretKmsKeyArn, '']]

Resources:
  # ── Website files ─────────────────────────────────────────────────────────
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: forget-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-site'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFrontReadsSite
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  # ── HTTPS certificate (validated automatically through Route 53) ─────────
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  # ── Family sign-in at the edge ───────────────────────────────────────────
  # Visitors without a session see the branded landing page (public/welcome)
  # at "/". Its form calls /auth/session with the username and password as a
  # Basic Authorization header; this function compares a SHA-256 of that header
  # with the stored hash (the password itself is never in AWS) and answers with
  # a signed, HttpOnly session cookie. Every other path — the school, its
  # assets and /api (the AI helper) — needs that cookie. No browser prompt.
  PasswordFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-password'
      AutoPublish: true
      FunctionConfig:
        Comment: Family sign-in for the virtual school
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        var crypto = require('crypto');
        var PASSWORD_HASH = '${BasicAuthHash}';
        var SESSION_KEY = '${SessionSecret}';
        var COOKIE = 'school_session';
        var MAX_AGE = 5184000;
        var PUBLIC = /^\/(welcome\/|favicon\.ico$|robots\.txt$)/;
        function sign(expires) {
          return crypto.createHmac('sha256', SESSION_KEY).update('v1.' + expires).digest('hex');
        }
        function signedIn(request) {
          var cookie = request.cookies[COOKIE];
          if (!cookie || !cookie.value) return false;
          var parts = cookie.value.split('.');
          if (parts.length !== 2) return false;
          var expires = parseInt(parts[0], 10);
          if (!(expires > Date.now() / 1000)) return false;
          return sign(parts[0]) === parts[1];
        }
        function reply(status, text, headers, cookies) {
          headers['cache-control'] = { value: 'no-store' };
          var response = { statusCode: status, statusDescription: text, headers: headers };
          if (cookies) response.cookies = cookies;
          return response;
        }
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri === '/auth/session') {
            var auth = request.headers.authorization;
            if (auth && crypto.createHash('sha256').update(auth.value).digest('hex') === PASSWORD_HASH) {
              var expires = String(Math.floor(Date.now() / 1000) + MAX_AGE);
              return reply(204, 'No Content', {}, {
                school_session: { value: expires + '.' + sign(expires), attributes: 'Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=' + MAX_AGE }
              });
            }
            return reply(401, 'Unauthorized', {});
          }
          if (uri === '/auth/logout') {
            return reply(302, 'Found', { location: { value: '/' } }, {
              school_session: { value: 'signed-out', attributes: 'Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=0' }
            });
          }
          delete request.headers.authorization;
          if (signedIn(request)) return request;
          if (uri === '/' || uri === '/index.html') {
            request.uri = '/welcome/index.html';
            return request;
          }
          if (PUBLIC.test(uri)) return request;
          if (uri.indexOf('/api/') === 0) return reply(401, 'Unauthorized', {});
          return reply(302, 'Found', { location: { value: '/' } });
        }

  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-security-headers'
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            # Same rules as `npm run preview`: nothing third-party; connections only
            # to this site, a local helper, or a parent-configured https endpoint.
            ContentSecurityPolicy: "default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https: http://127.0.0.1:* http://localhost:*; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: no-referrer
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: false
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: 'microphone=(self), camera=(), geolocation=(), payment=(), usb=()'
              Override: true
            - Header: X-Robots-Tag
              Value: 'noindex, nofollow'
              Override: true

  # ── Family sync: the school shared by the family's devices ────────────────
  # Records (books, progress, settings…) in DynamoDB, photos in S3. Both are kept
  # if the stack is ever deleted, and both keep history for recovery.
  FamilyRecordsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: changedAt, AttributeType: N }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: byChange
          KeySchema:
            - { AttributeName: pk, KeyType: HASH }
            - { AttributeName: changedAt, KeyType: RANGE }
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      # Encrypted at rest by default (AWS-owned key — no KMS charges or extra permissions).

  FamilyMediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: keep-replaced-photos-90-days
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90

  # ── AI teachers helper (Lambda, reached only through CloudFront /api/*) ──
  AiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-ai-helper'
      RetentionInDays: 14

  AiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub '${AiLogGroup.Arn}:*'
        # Family sync: read and write the family's records and photos (nothing else).
        - PolicyName: family-sync
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt FamilyRecordsTable.Arn
                  - !Sub '${FamilyRecordsTable.Arn}/index/byChange'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub '${FamilyMediaBucket.Arn}/media/*'
        # Read (never change) the one secret that holds the OpenAI key.
        - !If
          - HasOpenAiSecret
          - PolicyName: read-openai-key
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref OpenAiSecretArn
          - !Ref AWS::NoValue
        - !If
          - HasOpenAiKmsKey
          - PolicyName: decrypt-openai-key
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: kms:Decrypt
                  Resource: !Ref OpenAiSecretKmsKeyArn
                  Condition:
                    StringLike:
                      kms:ViaService: secretsmanager.*.amazonaws.com
          - !Ref AWS::NoValue

  AiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-ai-helper'
      Description: AI teachers helper for the virtual school (scripts/ai-helper/lambda.ts)
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: index.handler
      MemorySize: 512
      Timeout: 28
      Role: !GetAtt AiRole.Arn
      LoggingConfig:
        LogGroup: !Ref AiLogGroup
      Environment:
        Variables:
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          OPENAI_SECRET_ARN: !Ref OpenAiSecretArn
          OPENAI_MODEL: !Ref OpenAiModel
          SYNC_TABLE: !Ref FamilyRecordsTable
          SYNC_BUCKET: !Ref FamilyMediaBucket
          ORIGIN_SECRET: !Ref OriginSecret
          SITE_ORIGIN: !Sub 'https://${DomainName}'
          AI_MODEL: !Ref AiModel
          AI_DAILY_LIMIT: !Ref AiDailyLimit
      # Placeholder until the deploy uploads the real bundle (dist-lambda/ai-helper.zip).
      Code:
        ZipFile: |
          exports.handler = async () => ({
            statusCode: 503,
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ error: 'The AI helper code has not been uploaded yet.' })
          });

  AiFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt AiFunction.Arn
      AuthType: NONE

  # Function URLs with AuthType NONE need both statements (AWS requirement since Oct 2025).
  # The function itself refuses anything without CloudFront's X-Origin-Verify secret.
  AiUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AiFunction
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

  AiUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AiFunction
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true

  # ── CloudFront ───────────────────────────────────────────────────────────
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'Virtual school (${DomainName})'
        Aliases: [!Ref DomainName]
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: ai-helper
            DomainName: !Select [2, !Split ['/', !GetAtt AiFunctionUrl.FunctionUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: !Ref OriginSecret
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeaders
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt PasswordFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: ai-helper
            ViewerProtocolPolicy: https-only
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
            ResponseHeadersPolicyId: !Ref SecurityHeaders
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt PasswordFunction.FunctionMetadata.FunctionARN

  # ── lms.brianjeanbuilds.com → CloudFront ─────────────────────────────────
  DnsIPv4:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2 # CloudFront's fixed alias zone
        EvaluateTargetHealth: false

  DnsIPv6:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  # ── GitHub Actions deploys (no stored AWS keys: OpenID Connect) ──────────
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub 'Lets ${GitHubRepo}@${GitHubBranch} publish the site and AI helper'
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidc
                - !Ref GitHubOidcProvider
                - !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubRepo}:ref:refs/heads/${GitHubBranch}'
      Policies:
        - PolicyName: publish-site
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SiteBucket.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub '${SiteBucket.Arn}/*'
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
              - Effect: Allow
                Action: [lambda:UpdateFunctionCode, lambda:GetFunction, lambda:GetFunctionConfiguration]
                Resource: !GetAtt AiFunction.Arn
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Ref AWS::StackId

Outputs:
  FamilyRecordsTableName:
    Value: !Ref FamilyRecordsTable
    Description: DynamoDB table with the family's synced school (point-in-time recovery on).
  FamilyMediaBucketName:
    Value: !Ref FamilyMediaBucket
    Description: S3 bucket with the family's synced photos (versioned).
  SiteUrl:
    Value: !Sub 'https://${DomainName}'
  BucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  AiFunctionName:
    Value: !Ref AiFunction
  DeployRoleArn:
    Description: Put this in the GitHub repository secret AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt GitHubDeployRole.Arn
