name: Tavi routine review
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/e2e/tavi-routines.spec.ts'
      - 'tests/e2e/fixtures/routineSample.ts'
      - 'tests/unit/routine*.test.ts'
      - 'playwright.config.ts'
      - '.github/workflows/tavi-routines.yml'
permissions:
  contents: read
jobs:
  routine-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, phone]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- tests/e2e/tavi-routines.spec.ts --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tavi-routines-${{ matrix.project }}-${{ github.sha }}
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
