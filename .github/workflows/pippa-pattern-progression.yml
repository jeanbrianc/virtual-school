name: Pippa pattern progression review
on:
  pull_request:
    paths:
      - 'src/domain/lessons/**'
      - 'src/domain/teachers/registry.ts'
      - 'src/domain/curriculum/catalog.ts'
      - 'src/ui/child/flows/LessonFlow.tsx'
      - 'src/ui/child/lesson/**'
      - 'src/styles/pattern-progression.css'
      - 'tests/unit/pattern-progression*.test.ts'
      - 'tests/e2e/pattern-progression.spec.ts'
      - 'playwright.config.ts'
      - '.github/workflows/pippa-pattern-progression.yml'
# Only explicit sanitized captures may be uploaded by the combined release/main.
env:
  PLAYWRIGHT_SAFE_ARTIFACTS: ${{ (github.head_ref == 'codex/all-implemented-classroom-release' || github.ref == 'refs/heads/main') && 'true' || 'false' }}

permissions:
  contents: read
jobs:
  patterns-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, phone]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- tests/e2e/pattern-progression.spec.ts --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: always() && (env.PLAYWRIGHT_SAFE_ARTIFACTS != 'true' || success())
        with:
          name: pippa-pattern-progression-${{ matrix.project }}-${{ github.sha }}
          path: |
            test-results/**/*.png
            test-results/**/*.json
          retention-days: 7
          if-no-files-found: warn
