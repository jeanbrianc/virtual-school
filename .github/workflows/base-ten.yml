name: Place value review
on:
  pull_request:
    paths:
      - 'src/domain/lessons/baseTen.ts'
      - 'src/services/baseTenService.ts'
      - 'src/ui/child/flows/BaseTenFlow.tsx'
      - 'src/ui/child/lesson/BaseTenStage.tsx'
      - 'src/ui/child/ChildMode.tsx'
      - 'tests/**/base-ten*.ts'
      - '.github/workflows/base-ten.yml'
# Only explicit sanitized captures may be uploaded by the combined release/main.
env:
  PLAYWRIGHT_SAFE_ARTIFACTS: ${{ (github.head_ref == 'codex/all-implemented-classroom-release' || github.ref == 'refs/heads/main') && 'true' || 'false' }}

permissions:
  contents: read
jobs:
  place-value-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, phone]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: node scripts/build.mjs --e2e
      - run: npx playwright test tests/e2e/base-ten.spec.ts tests/e2e/activity-chooser.spec.ts tests/e2e/teacher-registry.spec.ts --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: always() && (env.PLAYWRIGHT_SAFE_ARTIFACTS != 'true' || success())
        with:
          name: place-value-browser-results-${{ matrix.project }}
          path: |
            test-results/**/*.png
            test-results/**/*.json
          if-no-files-found: ignore
