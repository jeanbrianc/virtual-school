name: Globe browser acceptance
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'playwright.config.ts'
      - 'package*.json'
      - '.github/workflows/globe-browser.yml'
# Only explicit sanitized captures may be uploaded by the combined release/main.
env:
  PLAYWRIGHT_SAFE_ARTIFACTS: ${{ (github.head_ref == 'codex/all-implemented-classroom-release' || github.ref == 'refs/heads/main') && 'true' || 'false' }}

permissions:
  contents: read
concurrency:
  group: globe-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  globe-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, phone]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test beginner and full-map adventures
        run: npm run test:e2e -- tests/e2e/globe.spec.ts --project=${{ matrix.project }}
      - name: Save synthetic screenshots and failure traces
        if: always() && (env.PLAYWRIGHT_SAFE_ARTIFACTS != 'true' || success())
        uses: actions/upload-artifact@v4
        with:
          name: globe-browser-${{ matrix.project }}-${{ github.sha }}
          path: |
            test-results/**/*.png
            test-results/**/*.json
          retention-days: 7
          if-no-files-found: warn
