name: Two-digit arithmetic review
on:
  pull_request:
    paths:
      - 'src/domain/lessons/baseTenArithmetic.ts'
      - 'src/services/arithmeticService.ts'
      - 'src/ui/child/flows/ArithmeticFlow.tsx'
      - 'src/ui/child/lesson/ArithmeticStage.tsx'
      - 'src/ui/child/ChildMode.tsx'
      - 'src/ui/parent/pages/ConversationsPage.tsx'
      - 'src/domain/types.ts'
      - 'src/styles/child.css'
      - 'src/styles/parent.css'
      - 'tests/**/base-ten-arithmetic*.ts'
      - '.github/workflows/base-ten-arithmetic.yml'
permissions:
  contents: read
jobs:
  arithmetic-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, phone]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Record exact arithmetic candidate
        run: |
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: node scripts/build.mjs --e2e
      - run: npx playwright test tests/e2e/base-ten-arithmetic.spec.ts tests/e2e/base-ten.spec.ts tests/e2e/activity-chooser.spec.ts tests/e2e/teacher-registry.spec.ts --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arithmetic-browser-results-${{ matrix.project }}
          path: test-results/
          if-no-files-found: ignore
