name: Teacher activity chooser review
on:
  pull_request:
    paths:
      - 'src/domain/teachers/registry.ts'
      - 'src/ui/child/flows/TeacherActivityChooser.tsx'
      - 'src/ui/child/flows/LessonFlow.tsx'
      - 'src/ui/child/ChildMode.tsx'
      - 'tests/e2e/activity-chooser.spec.ts'
      - '.github/workflows/activity-chooser.yml'
# Only explicit sanitized captures may be uploaded by the combined release/main.
env:
  PLAYWRIGHT_SAFE_ARTIFACTS: ${{ (github.head_ref == 'codex/all-implemented-classroom-release' || github.ref == 'refs/heads/main') && 'true' || 'false' }}

permissions:
  contents: read
jobs:
  chooser-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: node scripts/build.mjs --e2e
      - run: npx playwright test tests/e2e/activity-chooser.spec.ts tests/e2e/teacher-registry.spec.ts --project=desktop
      - uses: actions/upload-artifact@v4
        if: always() && (env.PLAYWRIGHT_SAFE_ARTIFACTS != 'true' || success())
        with:
          name: activity-chooser-browser-results
          path: |
            test-results/**/*.png
            test-results/**/*.json
          if-no-files-found: ignore
